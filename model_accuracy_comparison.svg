<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1120" viewBox="0 0 2200 1120" role="img" aria-labelledby="title desc">
  <title id="title">BiblioMatch model accuracy and performance comparison</title>
  <desc id="desc">Comparison of seven recommendation models using rating error, top ten ranking metrics, and binary decision accuracy, based on figures from the supplied notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f8fc"/><stop offset="1" stop-color="#eaf0f8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1e3657" flood-opacity=".12"/></filter>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.title{font-size:48px;font-weight:700;fill:#132943}.sub{font-size:22px;fill:#52677f}.th{font-size:20px;font-weight:700;fill:#fff}.td{font-size:21px;fill:#24384e}.strong{font-weight:700;fill:#155e50}.muted{font-size:17px;fill:#61748a}.pill{font-size:17px;font-weight:700;fill:#176754}
    </style>
  </defs>
  <rect width="2200" height="1120" fill="url(#bg)"/>
  <text x="90" y="100" class="sans title">BiblioMatch · Model Performance</text>
  <text x="90" y="145" class="sans sub">Recorded metrics across classical ML, deep learning, and the hybrid ensemble</text>
  <rect x="90" y="195" width="2020" height="765" rx="22" fill="#fff" filter="url(#shadow)"/>
  <rect x="90" y="195" width="2020" height="90" rx="22" fill="#173653"/>
  <rect x="90" y="260" width="2020" height="25" fill="#173653"/>
  <g class="sans th" dominant-baseline="middle">
    <text x="125" y="240">MODEL</text>
    <text x="850" y="240" text-anchor="middle">RMSE ↓</text>
    <text x="1040" y="240" text-anchor="middle">MAE ↓</text>
    <text x="1240" y="240" text-anchor="middle">Precision@10 ↑</text>
    <text x="1450" y="240" text-anchor="middle">Recall@10 ↑</text>
    <text x="1645" y="240" text-anchor="middle">NDCG@10 ↑</text>
    <text x="1905" y="240" text-anchor="middle">Binary accuracy ↑</text>
  </g>
  <g stroke="#e5ebf2" stroke-width="2">
    <path d="M110 382H2090 M110 477H2090 M110 572H2090 M110 667H2090 M110 762H2090 M110 857H2090"/>
  </g>
  <rect x="110" y="287" width="1980" height="95" rx="10" fill="#eaf6f2"/>
  <g class="sans td" dominant-baseline="middle">
    <text x="125" y="334" font-weight="700">End-to-End Hybrid Ensemble</text><text x="850" y="334" text-anchor="middle" class="strong">0.841</text><text x="1040" y="334" text-anchor="middle">0.648</text><text x="1240" y="334" text-anchor="middle">37.5%</text><text x="1450" y="334" text-anchor="middle">35.2%</text><text x="1645" y="334" text-anchor="middle">0.512</text><text x="1905" y="334" text-anchor="middle" class="strong">76.80%</text>
    <text x="125" y="429">Deep Learning · NeuMF / NCF</text><text x="850" y="429" text-anchor="middle">0.866</text><text x="1040" y="429" text-anchor="middle">0.691</text><text x="1240" y="429" text-anchor="middle">35.8%</text><text x="1450" y="429" text-anchor="middle">33.4%</text><text x="1645" y="429" text-anchor="middle">0.485</text><text x="1905" y="429" text-anchor="middle">73.58%</text>
    <text x="125" y="524">Quantized NeuMF · INT8</text><text x="850" y="524" text-anchor="middle">0.867</text><text x="1040" y="524" text-anchor="middle">0.690</text><text x="1240" y="524" text-anchor="middle">35.7%</text><text x="1450" y="524" text-anchor="middle">33.2%</text><text x="1645" y="524" text-anchor="middle">0.483</text><text x="1905" y="524" text-anchor="middle">73.50%</text>
    <text x="125" y="619">Collaborative Filtering · SVD</text><text x="850" y="619" text-anchor="middle">0.865</text><text x="1040" y="619" text-anchor="middle">0.672</text><text x="1240" y="619" text-anchor="middle">34.2%</text><text x="1450" y="619" text-anchor="middle">31.5%</text><text x="1645" y="619" text-anchor="middle">0.462</text><text x="1905" y="619" text-anchor="middle">71.20%</text>
    <text x="125" y="714">Content-Based · TF-IDF</text><text x="850" y="714" text-anchor="middle">0.942</text><text x="1040" y="714" text-anchor="middle">0.738</text><text x="1240" y="714" text-anchor="middle">28.5%</text><text x="1450" y="714" text-anchor="middle">24.1%</text><text x="1645" y="714" text-anchor="middle">0.385</text><text x="1905" y="714" text-anchor="middle">65.40%</text>
    <text x="125" y="809">Popularity Linear Regression</text><text x="850" y="809" text-anchor="middle">0.912</text><text x="1040" y="809" text-anchor="middle">0.710</text><text x="1240" y="809" text-anchor="middle">19.8%</text><text x="1450" y="809" text-anchor="middle">16.5%</text><text x="1645" y="809" text-anchor="middle">0.285</text><text x="1905" y="809" text-anchor="middle">58.20%</text>
    <text x="125" y="904">Random Baseline</text><text x="850" y="904" text-anchor="middle">1.450</text><text x="1040" y="904" text-anchor="middle">1.180</text><text x="1240" y="904" text-anchor="middle">4.5%</text><text x="1450" y="904" text-anchor="middle">3.8%</text><text x="1645" y="904" text-anchor="middle">0.082</text><text x="1905" y="904" text-anchor="middle">20.10%</text>
  </g>
  <rect x="90" y="990" width="2020" height="78" rx="14" fill="#fff" opacity=".82"/>
  <text x="120" y="1024" class="sans muted">↓ Lower is better for rating error (RMSE, MAE) · ↑ Higher is better for ranking and decision metrics.</text>
  <text x="120" y="1050" class="sans muted">Values reproduced from the supplied project notes; they are presented as reported, not independently re-evaluated here.</text>
</svg>
